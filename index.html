<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dialihkan ke devdian.pages.dev</title>

<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://devdian.pages.dev/">

<!-- Pengalihan cadangan. Di Cloudflare Pages, file _redirects sudah
     mengirim 301 lebih dulu, jadi halaman ini normalnya TIDAK pernah tampil.
     Halaman ini hanya jaring pengaman kalau _redirects tidak terbaca. -->
<meta http-equiv="refresh" content="0; url=https://devdian.pages.dev/">

<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #1e3a8a 0%, #0b1020 60%, #070a14 100%);
    color: #e6ecff; padding: 24px;
  }
  .card {
    max-width: 520px; width: 100%; text-align: center;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12);
    border-radius: 20px; padding: 40px 28px;
    box-shadow: 0 24px 60px rgba(0,0,0,.45); backdrop-filter: blur(8px);
  }
  .dot {
    width: 46px; height: 46px; margin: 0 auto 20px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.15); border-top-color: #60a5fa;
    animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 1.25rem; margin: 0 0 10px; letter-spacing: -.01em; }
  p { margin: 0 0 22px; color: #9fb0d0; font-size: .95rem; line-height: 1.6; }
  a.btn {
    display: inline-block; text-decoration: none; font-weight: 600; font-size: .95rem;
    background: #3b82f6; color: #fff; padding: 12px 22px; border-radius: 12px;
    transition: transform .15s ease, background .15s ease;
  }
  a.btn:hover { background: #2563eb; transform: translateY(-1px); }
  .small { margin-top: 22px; font-size: .8rem; color: #6f81a3; }
  .small a { color: #8ab4ff; text-decoration: none; }
</style>
</head>
<body>
  <main class="card">
    <div class="dot" aria-hidden="true"></div>
    <h1>Mengalihkan ke devdian.pages.dev</h1>
    <p>Halaman depan alatdevdian sekarang pindah ke situs utama.<br>
       Semua halaman alat tetap bisa diakses langsung seperti biasa.</p>
    <a class="btn" href="https://devdian.pages.dev/">Lanjut ke devdian.pages.dev</a>
    <div class="small">
      Mencari halaman alat? <a href="/alat/buat-surat-lamaran-kerja">Buat Surat Lamaran Kerja</a>
    </div>
  </main>
  <script>
    // Jaring pengaman kedua (kalau meta refresh diabaikan browser).
    if (!/[?&]tetap=1/.test(location.search)) {
      location.replace("https://devdian.pages.dev/" + location.search);
    }
  </script>
</body>
</html>
